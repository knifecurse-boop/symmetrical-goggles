[project]
name = "audio-clipper"
version = "0.1.0"
description = "根據逐字稿批次剪輯並匯出音檔片段"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0.0",
    "rapidfuzz>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
audio-clipper = "audio_clipper.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
